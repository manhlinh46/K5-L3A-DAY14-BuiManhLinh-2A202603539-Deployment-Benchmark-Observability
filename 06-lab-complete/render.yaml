# Render Blueprint — phương án thay thế cho railway.toml.
# Lưu ý: Render đọc render.yaml ở GỐC repo; muốn dùng thì copy file này ra gốc repo
# (rootDir đã trỏ vào 06-lab-complete).
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        generateValue: true        # Render tự sinh secret, không ghi thẳng giá trị
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []                # chỉ cho phép kết nối nội bộ trong Render
